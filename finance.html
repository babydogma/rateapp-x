<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Финансы — RateApp X</title>

  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0e0e0f" />

  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div id="financeModal" class="category-modal">
    <div class="category-modal__box finance-modal-box">
      <div class="category-modal__title">Новая операция</div>

      <label class="category-modal__label" for="financeTypeInput">Тип</label>
      <select id="financeTypeInput" class="category-modal__input finance-select">
        <option value="expense">Расход</option>
        <option value="income">Доход</option>
      </select>

      <label class="category-modal__label" for="financeAmountInput">Сумма</label>
      <input
        id="financeAmountInput"
        class="category-modal__input"
        type="number"
        min="0"
        step="0.01"
        placeholder="Например, 850"
      >

      <label class="category-modal__label" for="financeCategoryInput">Категория</label>
      <select id="financeCategoryInput" class="category-modal__input finance-select">
        <option value="Еда">Еда</option>
        <option value="Дом">Дом</option>
        <option value="Транспорт">Транспорт</option>
        <option value="Подписки">Подписки</option>
        <option value="Семья">Семья</option>
        <option value="Развлечения">Развлечения</option>
        <option value="Здоровье">Здоровье</option>
        <option value="Одежда">Одежда</option>
        <option value="Зарплата">Зарплата</option>
        <option value="Подработка">Подработка</option>
        <option value="Прочее" selected>Прочее</option>
      </select>

      <label class="category-modal__label" for="financeDateInput">Дата</label>
      <input
        id="financeDateInput"
        class="category-modal__input"
        type="date"
      >

      <label class="category-modal__label" for="financeCommentInput">Комментарий</label>
      <textarea
        id="financeCommentInput"
        class="category-modal__input finance-note-input"
        placeholder="Кратко: что это было"
      ></textarea>

      <div class="category-modal__actions">
  <button id="financeModalCancel" type="button" class="category-modal__btn category-modal__btn--ghost">
    Отмена
  </button>

  <button id="financeModalSave" type="button" class="category-modal__btn category-modal__btn--primary">
    Сохранить
  </button>
</div>
    </div>
  </div>

  <div id="financeConfirmModal" class="confirm-modal">
    <div class="confirm-modal__box">
      <div class="confirm-modal__title">Удаление</div>
      <div class="confirm-modal__text">Удалить эту операцию?</div>

      <div class="confirm-modal__actions">
        <button id="financeConfirmCancel" type="button" class="category-modal__btn category-modal__btn--ghost">
          Отмена
        </button>
        <button id="financeConfirmDelete" type="button" class="category-modal__btn category-modal__btn--danger">
          Удалить
        </button>
      </div>
    </div>
  </div>
  
    <div id="requiredPaymentModal" class="category-modal">
    <div class="category-modal__box finance-modal-box">
      <div class="category-modal__title" id="requiredPaymentModalTitle">Обязательный платеж</div>

      <label class="category-modal__label" for="requiredPaymentAmountInput">Сумма</label>
      <input
        id="requiredPaymentAmountInput"
        class="category-modal__input"
        type="number"
        min="0"
        step="0.01"
        placeholder="Например, 25000"
      >

      <label class="category-modal__label" for="requiredPaymentFrequencyInput">Тип</label>
      <select id="requiredPaymentFrequencyInput" class="category-modal__input finance-select">
        <option value="monthly">Ежемесячно</option>
        <option value="weekly">Еженедельно</option>
      </select>

      <label class="category-modal__label" for="requiredPaymentEndDateInput">Дата окончания</label>
      <input
        id="requiredPaymentEndDateInput"
        class="category-modal__input"
        type="date"
      >

      <label class="finance-switch">
        <input id="requiredPaymentActiveInput" type="checkbox" checked>
        <span>Платеж активен</span>
      </label>
      
      <div id="requiredPaymentItemsSection" class="required-items-section">
  <div class="required-items-section__head">
    <div class="required-items-section__title">Вложенные платежи</div>
    <button id="requiredPaymentAddItemBtn" type="button" class="required-items-section__add-btn">
      Добавить
    </button>
  </div>

  <div id="requiredPaymentItemsList" class="required-items-list"></div>

  <div id="requiredPaymentItemForm" class="required-item-form">
    <input
      id="requiredPaymentItemTitleInput"
      class="category-modal__input"
      type="text"
      placeholder="Название"
    >

    <input
      id="requiredPaymentItemAmountInput"
      class="category-modal__input"
      type="number"
      min="0"
      step="0.01"
      placeholder="Сумма"
    >

    <input
  id="requiredPaymentItemDueDayInput"
  class="category-modal__input"
  type="date"
>

    <div class="required-item-form__actions">
      <button id="requiredPaymentItemSaveBtn" type="button" class="category-modal__btn category-modal__btn--primary">
        Сохранить
      </button>
    </div>
  </div>
</div>

      <div class="category-modal__actions">
  <button id="requiredPaymentModalCancel" type="button" class="category-modal__btn category-modal__btn--ghost">
    Отмена
  </button>

  <button id="requiredPaymentModalPay" type="button" class="category-modal__btn finance-pay-btn">
    Оплачено
  </button>

  <button id="requiredPaymentModalSave" type="button" class="category-modal__btn category-modal__btn--primary">
    Сохранить
  </button>
</div>
    </div>
  </div>

  <main class="app">
    <section class="top-panel">
      <header class="header">
        <div class="app-title">
          <div class="logo-text">Финансы</div>
        </div>
      </header>

      <section class="stats" id="financeStats">
        Загрузка финансов...
      </section>
            <section class="finance-required">
 <div class="finance-required__accordion" id="financeRequiredAccordion">
    <button type="button" class="finance-required__summary" id="financeRequiredToggle">
      <div>
        <div class="finance-required__title">Обязательные платежи</div>
        <div class="finance-required__hint">Нажми на карточку, чтобы изменить сумму</div>
      </div>
      <span class="finance-required__chevron">▾</span>
    </button>

    <div class="finance-required__content" id="financeRequiredContent">
      <div class="finance-required__list" id="financeRequiredList"></div>
    </div>
  </div>
</section>

      <section class="finance-summary" id="financeSummary">
        <div class="finance-summary-card">
          <span class="finance-summary-card__label">Доходы</span>
          <strong id="summaryIncome">0 ₽</strong>
        </div>

        <div class="finance-summary-card">
          <span class="finance-summary-card__label">Расходы</span>
          <strong id="summaryExpense">0 ₽</strong>
        </div>

        <div class="finance-summary-card">
          <span class="finance-summary-card__label">Остаток</span>
          <strong id="summaryBalance">0 ₽</strong>
        </div>

        <div class="finance-summary-card">
          <span class="finance-summary-card__label">За сегодня</span>
<strong id="summaryDaily">0 ₽</strong>
      </section>

      <section class="rating-filters finance-filters">
        <button id="financeFilterAll" class="rating-filter active" type="button">Все</button>
        <button id="financeFilterExpense" class="rating-filter" type="button">Расходы</button>
        <button id="financeFilterIncome" class="rating-filter" type="button">Доходы</button>
      </section>
    </section>

    <section class="finance-list" id="financeList"></section>
  </main>

  <nav class="bottom-nav">
    <button class="nav-emoji" data-page="home" aria-label="Главная">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3 10.5L12 3l9 7.5"></path>
        <path d="M5.5 9.5V20h13V9.5"></path>
        <path d="M9.5 20v-5.5h5V20"></path>
      </svg>
    </button>

    <button class="nav-emoji nav-ruble is-current" data-page="finance" aria-label="Финансы">
      <span class="nav-ruble__icon">₽</span>
    </button>

    <div class="nav-center-slot" aria-hidden="true"></div>

    <button class="nav-emoji" data-page="sleep" aria-label="Сон">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M18.5 14.5A6.5 6.5 0 0 1 9.5 5.5a7.5 7.5 0 1 0 9 9z"></path>
      </svg>
    </button>

    <button class="nav-emoji" data-page="categories" aria-label="Категории">
      <svg class="nav-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path d="M3.5 7.5A2.5 2.5 0 0 1 6 5h4l2 2h6A2.5 2.5 0 0 1 20.5 9.5v7A2.5 2.5 0 0 1 18 19H6a2.5 2.5 0 0 1-2.5-2.5z"></path>
        <path d="M3.5 9h17"></path>
      </svg>
    </button>

    <button id="addFinanceBtn" class="add-btn" type="button" aria-label="Добавить операцию">+</button>
  </nav>

  <script src="finance.js"></script>
</body>
</html>
